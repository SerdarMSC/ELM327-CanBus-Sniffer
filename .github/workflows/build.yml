name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets context'i step 'if:' icinde kullanilamaz, job env'ine tasiyoruz
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      # Projede gradle wrapper yok; setup-gradle sabit surumlu Gradle saglar.
      # Wrapper'i repoya eklersen bu adimda 'gradle-version' satirini silebilirsin.
      - name: Gradle kur (cache dahil)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Debug APK derle
        run: gradle --no-daemon assembleDebug

      - name: Debug APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: can-monitor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------- release
      # Asagisi yalnizca 'v1.0' gibi bir tag pushlandiginda calisir.

      - name: Release APK derle
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle --no-daemon assembleRelease

      - name: Keystore'u coz
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK imzala
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/can-monitor-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/can-monitor-release.apk \
            app/build/outputs/apk/release/can-monitor-aligned.apk

      - name: Release olustur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/can-monitor-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
